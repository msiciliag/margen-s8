name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validar SHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build

  build-android:
    name: Compilar Android
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - run: bash scripts/empaquetar.sh android
      - uses: actions/upload-artifact@v4
        with:
          name: entrega-android
          path: entrega/*
          if-no-files-found: error

  build-windows:
    name: Compilar Windows
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: bash scripts/empaquetar.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: entrega-windows
          path: entrega/*
          if-no-files-found: error

  build-macos:
    name: Compilar macOS
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: bash scripts/empaquetar.sh macos
      - uses: actions/upload-artifact@v4
        with:
          name: entrega-macos
          path: entrega/*
          if-no-files-found: error

  build-ios:
    name: Compilar iOS
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: bash scripts/empaquetar.sh ios
      - uses: actions/upload-artifact@v4
        with:
          name: entrega-ios
          path: entrega/*
          if-no-files-found: error

  publish:
    name: Publicar release
    needs: [build-android, build-windows, build-macos, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: aula-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: Aula ${{ github.sha }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
